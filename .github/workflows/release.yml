name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to update, e.g. v1.3.0"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  build:
    name: Build release app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" QuickBrowser/QuickBrowser/App/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release target
        id: release
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.version }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            test "$GITHUB_REF" = "refs/tags/$EXPECTED_TAG"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            test "${{ inputs.release_tag }}" = "$EXPECTED_TAG"
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          RELEASE_TAG="${{ steps.release.outputs.release_tag }}"
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^$RELEASE_TAG$" | head -n 1 || true)

          {
            echo "## QuickBrowser ${{ steps.version.outputs.version }}"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log "$PREVIOUS_TAG..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Changes:"
              echo
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Build
        run: |
          xcodebuild \
            -project QuickBrowser/QuickBrowser.xcodeproj \
            -scheme QuickBrowser \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/quickbrowser-derived" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package
        run: |
          cd "$RUNNER_TEMP/quickbrowser-derived/Build/Products/Release"
          zip -r -X "$GITHUB_WORKSPACE/QuickBrowser-${{ steps.version.outputs.version }}.zip" QuickBrowser.app
          shasum -a 256 "$GITHUB_WORKSPACE/QuickBrowser-${{ steps.version.outputs.version }}.zip" > "$GITHUB_WORKSPACE/QuickBrowser-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            QuickBrowser-${{ steps.version.outputs.version }}.zip
            QuickBrowser-${{ steps.version.outputs.version }}.zip.sha256
